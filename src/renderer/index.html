<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tony Browser</title>
    <style>
      /* ─── Evernote Design Tokens (DESIGN_4) ─── */
      :root {
        /* Colors — cream + charcoal + lime triad is the system */
        --aaply-yellow: #94e130;        /* Lime Sprout — SINGLE energy accent: CTA, icons, highlights */
        --aaply-sunbeam: #a8f04a;       /* brighter lime variant */
        --aaply-red: #94e130;           /* lime (Evernote: no second accent) */
        --aaply-blue: #4a8fe0;          /* icon-square blue (category coding only) */
        --aaply-peach: #f4eee5;         /* Ivory Card — warm-toned elevated panels */
        --aaply-carbon: #141414;        /* Charcoal — primary text, dark filled buttons */
        --aaply-paper: #ffffff;         /* Pure White — elevated card surfaces */
        --aaply-mist: #f9f6f2;          /* Paper Cream — page canvas (never pure white) */
        --aaply-hairline: #e7e7e7;      /* Slate Border — hairline card borders, dividers */
        --aaply-shadow-gray: #a1a1a1;   /* Smoke — muted link borders, subtle dividers */

        /* Evernote extended neutrals */
        --ev-stone: #737373;            /* helper text, tertiary body */
        --ev-graphite: #4e4d4c;         /* secondary text, icon strokes */
        --ev-iron: #262626;             /* dark surface elements */
        --ev-onyx: #141414;             /* max-contrast borders, SVG fills */

        --font-display: 'Figtree', 'Inter', 'DM Sans', 'Nunito Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-body: 'Figtree', 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        /* Radius — Evernote: subtle rounding, buttons 5px / cards 10px / large 16px / tags pill */
        --radius-inputs: 5px;
        --radius-cards: 10px;
        --radius-cards-lg: 16px;
        --radius-nav: 5px;
        --radius-pill: 52px;

        /* Elevation — FLAT: no drop shadows, hairline borders carry separation */
        --shadow-md: none;

        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--font-body);
        background: var(--aaply-mist);
        /* Paper Cream canvas — warm flat surface, no texture */
        color: var(--aaply-carbon);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: var(--aaply-yellow); color: #141414; }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(20,20,20,0.2); border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(20,20,20,0.4); }

      .apple-focus:focus-visible {
        outline: 3px solid var(--aaply-yellow);
        outline-offset: 2px;
        border-radius: var(--radius-inputs);
      }

      /* ─── Motion ─── */
      @keyframes tony-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes tony-slide-up { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes tony-slide-right { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes tony-pop { 0% { opacity: 0; transform: scale(0.9); } 60% { transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes tony-toast-in { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes tony-spin { to { transform: rotate(360deg); } }

      .anim-fade { animation: tony-fade-in 0.25s var(--ease-out) both; }
      .anim-slide-up { animation: tony-slide-up 0.3s var(--ease-out) both; }
      .anim-slide-right { animation: tony-slide-right 0.25s var(--ease-out) both; }
      .anim-pop { animation: tony-pop 0.25s var(--ease-out) both; }
      .anim-toast { animation: tony-toast-in 0.3s var(--ease-out) both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
